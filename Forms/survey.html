<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>
 <body>
<h1 id="title">freeCodeCamp Survey Form</h1>
<p id="description">Thank you for taking the time to help us improve the platform</p>
<form id="survey-form">
  <label for="name" id="name-label">Name</label>
  <input required type="text" id="name" placeholder="Enter your name"/><br>
  <label for="email" id="email-label">Email</label>
  <input required type="email" id="email" placeholder="Enter your email"><br>
  <label for="number" id="number-label">Age (optional)</label>
  <input type="number" id="number" min="10" max="99" placeholder="Age">
<br><br>
<select id="dropdown">
  <option value="select">Select your current role</option>
  <option value="student" >Student</option>
  <option value="devloper">Devloper</option>
  </select>
  <br>
<p>Would you recommend us?</p>
 
    <input type="radio" name="recommend" value="definetly">
  <label for="definetly">Definetly </label>
    
    <input type="radio" name="recommend" value="offcourse">
  <label for="offcourse">Offcourse</label>

  <p>What would you like to see improved? (Check all that apply)</p>
    <label><input type="checkbox" value="projects"> Projects</label>
    <label><input type="checkbox" value="challenges"> Challenges</label>
    <label><input type="checkbox" value="community"> Community</label>
    <br><br>


    <label for="comments">Additional Comments:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="40" placeholder="Enter your comments here..."></textarea>
    <br><br>

    <button type="submit" id="submit">Submit</button>

</form>
  </body>
</html>
